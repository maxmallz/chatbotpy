name: chatbotpy

services:
  db:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3037:3306"  # 3036 is the Node app's MySQL 8.4
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP only answers once the init scripts are done (init runs with skip-networking).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  app:
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV:-0}
    image: chatbotpy:dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_DB_URL: mysql+aiomysql://chatbotpy:chatbotpypass@db:3306/chatbotpy
      MES_DB_URL: mysql+pymysql://mes_reader:readerpass@db:3306/mes
      # Set by scripts/docker-run.sh from CHATBOTJS_DB_URL, with 127.0.0.1 -> host.docker.internal.
      CHATBOTJS_DB_URL: ${CHATBOTJS_DB_URL_DOCKER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["app"]  # only started by `docker compose run app ...`

volumes:
  mysqldata:
